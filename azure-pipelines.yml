name: postcode-mp-lookup-$(rev:r)

pool:
  name: RSConnect

trigger:
  branches:
    include:
    - main
  paths:
    exclude:
    - azure-pipelines.yml

resources:
  repositories:
    - repository: posit-deploy
      type: git
      name: ESFA-Data-Science/posit-deploy

extends:
  template: deploy.yml@posit-deploy
  parameters:
    appName: mp-lookup-postcode-search
    environments:
    - name: Pre-Production
      appId: 1089
    - name: Production
      appId: 541
